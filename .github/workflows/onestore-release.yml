
name: RoutineFit ONEstore Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f RoutineFit_Android_Project.zip
          mkdir -p android-src
          unzip -q -o RoutineFit_Android_Project.zip -d android-src
          test -f android-src/app/build.gradle

      - name: Apply v1.6.6 policy and signing update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          base = Path('android-src/app')
          f = base / 'build.gradle'
          g = f.read_text(encoding='utf-8')
          assert "applicationId 'com.nanami128sketch.routinefit'" in g
          g = re.sub(r'(?m)^\s*versionCode\s+\d+', '        versionCode 166', g, count=1)
          g = re.sub(r"(?m)^\s*versionName\s+'[^']+'", "        versionName '1.6.6'", g, count=1)
          if 'def signingKeyPath' not in g:
              g = g.replace("plugins { id 'com.android.application' }", "plugins { id 'com.android.application' }\ndef signingKeyPath = System.getenv('ROUTINEFIT_KEYSTORE_PATH')", 1)
              g = g.replace('android {', '''android {
              signingConfigs {
                  release {
                      if (signingKeyPath) {
                          storeFile file(signingKeyPath)
                          storePassword System.getenv('ROUTINEFIT_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('ROUTINEFIT_KEY_ALIAS')
                          keyPassword System.getenv('ROUTINEFIT_KEY_PASSWORD')
                      }
                  }
              }
          ''', 1)
          if 'signingConfig signingConfigs.release' not in g:
              g = g.replace('release { minifyEnabled false }', 'release { minifyEnabled false; if (signingKeyPath) signingConfig signingConfigs.release }', 1)
          assert 'versionCode 166' in g and 'signingConfig signingConfigs.release' in g
          f.write_text(g, encoding='utf-8')
          assets = base / 'src/main/assets'
          for name in ('privacy.html','terms.html','copyright_notice.html','advertising_notice.html'):
              source = Path(name)
              assert source.is_file(), 'Policy missing: ' + name
              assert 'nanami1288@naver.com' in source.read_text(encoding='utf-8')
              shutil.copyfile(source, assets / name)
          file = assets / 'index.html'
          html = file.read_text(encoding='utf-8')
          assert "const VERSION='1.6." in html
          html = re.sub(r"const VERSION='1\.6\.\d+'", "const VERSION='1.6.6'", html, count=1)
          if 'copyright_notice.html' not in html:
              marker = '<div class="version-footer">ROUTINE FIT v${VERSION}'
              assert html.count(marker) == 1
              links = '''<div class="setting-group"><h3>서비스 및 이용 안내</h3><p><a href="terms.html">이용약관</a>　<a href="copyright_notice.html">저작권·신고</a>　<a href="advertising_notice.html">광고·협찬 안내</a></p></div>'''
              html = html.replace(marker, links + marker, 1)
          file.write_text(html, encoding='utf-8')
          print('RoutineFit v1.6.6 policy update ready')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ROUTINEFIT_KEYSTORE_B64 }}
          ROUTINEFIT_KEYSTORE_PASSWORD: ${{ secrets.ROUTINEFIT_KEYSTORE_PASSWORD }}
          ROUTINEFIT_KEY_ALIAS: ${{ secrets.ROUTINEFIT_KEY_ALIAS }}
          ROUTINEFIT_KEY_PASSWORD: ${{ secrets.ROUTINEFIT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$ROUTINEFIT_KEYSTORE_PASSWORD" || -z "$ROUTINEFIT_KEY_ALIAS" || -z "$ROUTINEFIT_KEY_PASSWORD" ]]; then
            echo '::error::Missing signing secrets'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/routinefit-release.jks"
          export ROUTINEFIT_KEYSTORE_PATH="$RUNNER_TEMP/routinefit-release.jks"
          gradle -p android-src --no-daemon assembleRelease
          APK=android-src/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Save signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RoutineFit-v1.6.6-ONEstore-release-APK
          path: android-src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
